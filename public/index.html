<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <title>ハロプロ ジャケ写パズル</title>
  <meta name="description" content="ハロー！プロジェクトのジャケット写真で遊べる非公式ジグソーパズル" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ===================== ホーム画面 ===================== -->
  <div id="home" class="screen">
    <header class="home-header">
      <div class="home-header__inner">
        <h1 class="logo"><span class="logo__mark">🧩</span>ハロプロ<span class="logo__accent">ジャケ写</span>パズル</h1>
        <button id="random-btn" class="btn btn--ghost" type="button">🎲 ランダム</button>
      </div>
    </header>

    <main class="home-main">
      <section class="filters" aria-label="絞り込み">
        <div class="chip-row" id="group-tabs" role="tablist" aria-label="グループ"></div>
        <div class="filter-bar">
          <div class="chip-row chip-row--small" id="category-chips" aria-label="ジャンル"></div>
          <div class="filter-bar__right">
            <select id="artist-select" class="select" hidden aria-label="アーティスト"></select>
            <input id="search" class="search" type="search" placeholder="タイトルで検索" enterkeyhint="search" />
          </div>
        </div>
      </section>

      <p id="result-count" class="result-count"></p>
      <div id="release-grid" class="release-grid"></div>
      <div id="grid-sentinel" class="grid-sentinel"></div>
      <p id="home-status" class="home-status">読み込み中…</p>
    </main>

    <footer class="home-footer">
      <p>非公式のファンメイド作品です。ジャケット写真は <a href="https://helloproject.com/" target="_blank" rel="noopener">helloproject.com</a> から読み込んでおり、著作権は各権利者に帰属します。</p>
    </footer>
  </div>

  <!-- ===================== ジャケ写選択後の設定パネル ===================== -->
  <dialog id="setup" class="setup">
    <form method="dialog" class="setup__inner">
      <button class="setup__close icon-btn" value="cancel" aria-label="閉じる">✕</button>
      <div class="setup__preview">
        <img id="setup-img" alt="" />
      </div>
      <div class="setup__body">
        <p id="setup-meta" class="setup__meta"></p>
        <h2 id="setup-title" class="setup__title"></h2>
        <p class="setup__artist"><span id="setup-artist"></span> <a id="setup-link" target="_blank" rel="noopener">公式ページ ↗</a></p>

        <h3 class="setup__label">ピース数</h3>
        <div id="piece-options" class="piece-options"></div>

        <h3 class="setup__label">難易度</h3>
        <div id="difficulty-options" class="difficulty-options"></div>

        <p id="setup-best" class="setup__best"></p>
        <div class="setup__actions">
          <button id="resume-btn" class="btn btn--ghost btn--lg" type="button" hidden>続きから</button>
          <button id="start-btn" class="btn btn--primary btn--lg" type="button">ゲームスタート</button>
        </div>
      </div>
    </form>
  </dialog>

  <!-- ===================== ゲーム画面 ===================== -->
  <div id="game" class="screen game" hidden>
    <div id="board" class="game__board"></div>

    <header class="game-bar">
      <button id="g-home" class="icon-btn" type="button" title="ホームへ戻る" aria-label="ホームへ戻る">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="game-bar__title">
        <span id="g-title"></span>
        <small id="g-sub"></small>
      </div>
      <div class="game-bar__stats">
        <span id="g-progress" class="stat" title="完成度">0%</span>
        <span id="g-timer" class="stat stat--time" title="経過時間">0:00</span>
      </div>
      <div class="game-bar__tools">
        <button id="g-preview" class="icon-btn" type="button" title="見本を表示 (P)" aria-label="見本">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>
        </button>
        <button id="g-edges" class="icon-btn" type="button" title="端のピースだけ表示 (E)" aria-label="端のピースだけ表示">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><rect x="9" y="9" width="6" height="6" stroke-dasharray="2 2"/></svg>
        </button>
        <button id="g-scatter" class="icon-btn" type="button" title="バラバラのピースを並べ直す" aria-label="並べ直す">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6"/><rect x="15" y="3" width="6" height="6"/><rect x="3" y="15" width="6" height="6"/><rect x="15" y="15" width="6" height="6"/></svg>
        </button>
        <button id="g-fit" class="icon-btn" type="button" title="全体を表示 (F)" aria-label="全体を表示">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <button id="g-bg" class="icon-btn" type="button" title="背景色を変える" aria-label="背景色">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>
        </button>
        <button id="g-sound" class="icon-btn" type="button" title="効果音" aria-label="効果音">
          <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="sound-wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="sound-off" d="M16 9l5 6M21 9l-5 6"/></svg>
        </button>
        <button id="g-full" class="icon-btn" type="button" title="全画面" aria-label="全画面">
          <svg viewBox="0 0 24 24"><path d="M4 4h6M4 4v6M20 4h-6M20 4v6M4 20h6M4 20v-6M20 20h-6M20 20v-6"/></svg>
        </button>
        <button id="g-pause" class="icon-btn" type="button" title="一時停止" aria-label="一時停止">
          <svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>
        </button>
      </div>
    </header>

    <div id="g-preview-panel" class="preview-panel" hidden>
      <img id="g-preview-img" alt="見本" />
    </div>

    <div id="g-hint" class="game-hint"></div>

    <div id="g-loading" class="game-overlay">
      <div class="spinner"></div>
      <p>ジャケ写を読み込み中…</p>
    </div>

    <div id="g-paused" class="game-overlay game-overlay--solid" hidden>
      <p class="paused-label">一時停止中</p>
      <button id="g-resume" class="btn btn--primary btn--lg" type="button">再開する</button>
    </div>

    <div id="g-error" class="game-overlay game-overlay--solid" hidden>
      <p id="g-error-msg">画像を読み込めませんでした。</p>
      <button id="g-error-home" class="btn btn--primary" type="button">ホームへ戻る</button>
    </div>

    <!-- リザルト画面 -->
    <div id="result" class="result" hidden>
      <div class="result__card">
        <p class="result__eyebrow">COMPLETE!</p>
        <h2 class="result__heading">完成しました 🎉</h2>
        <div class="result__img"><img id="r-img" alt="" /></div>
        <p id="r-title" class="result__title"></p>
        <dl class="result__stats">
          <div><dt>タイム</dt><dd id="r-time"></dd></div>
          <div><dt>ピース</dt><dd id="r-pieces"></dd></div>
          <div><dt>難易度</dt><dd id="r-diff"></dd></div>
        </dl>
        <p id="r-best" class="result__best"></p>
        <div class="result__actions">
          <button id="r-retry" class="btn btn--primary btn--lg" type="button">もう一度遊ぶ</button>
          <button id="r-change" class="btn btn--ghost" type="button">設定を変える</button>
          <button id="r-home" class="btn btn--ghost" type="button">ホームへ</button>
        </div>
        <button id="r-view" class="result__view" type="button">完成した絵をながめる</button>
      </div>
    </div>
    <button id="r-back" class="result-back btn btn--primary" type="button" hidden>リザルトを表示</button>
    <canvas id="confetti" class="confetti" hidden></canvas>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
